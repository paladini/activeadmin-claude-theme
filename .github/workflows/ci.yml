name: CI

on:
  pull_request:
  push:
    branches: [main, master]

jobs:
  test-aa4:
    runs-on: ubuntu-latest
    env:
      BUNDLE_GEMFILE: ${{ github.workspace }}/Gemfile
      DUMMY_PATH: dummy

    steps:
      - uses: actions/checkout@v4

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: test/dummy/package-lock.json

      - name: Install npm dependencies
        working-directory: test/dummy
        run: npm ci

      - name: Build Active Admin CSS
        working-directory: test/dummy
        run: npm run build:css

      - name: Prepare test database
        working-directory: test/dummy
        run: bundle exec rails db:test:prepare

      - name: Run AA4 tests
        run: |
          ruby -Itest test/activeadmin_claude_theme_test.rb
          ruby -Itest test/integration/theme_integration_test.rb

  test-aa3:
    runs-on: ubuntu-latest
    env:
      BUNDLE_GEMFILE: ${{ github.workspace }}/gemfiles/activeadmin_3.gemfile
      DUMMY_PATH: dummy_aa3

    steps:
      - uses: actions/checkout@v4

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true

      - name: Prepare test database
        working-directory: test/dummy_aa3
        run: bundle exec rails db:test:prepare

      - name: Run AA3 tests
        run: |
          ruby -Itest test/activeadmin_claude_theme_test.rb
          ruby -Itest test/integration/aa3_theme_integration_test.rb

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true

      - name: RuboCop
        run: bundle exec rubocop --parallel
